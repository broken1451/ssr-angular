@if (pokemon() === null || !pokemon()) {

    <div class="flex justify-center">
        <h1 class="text-4xl font-bold"> Loading...</h1>
    </div>

} @else {

    @let mypokemon = pokemon()!; 

    <section class="flex flex-col justify-center">
        <div class="flex justify-center">
            <h1 class="text-4xl font-bold capitalize my-5"> {{ mypokemon.name }}</h1>
        </div>
    </section>

    <section class="flex flex-col justify-center items-center w-full">
        <img class="w-64 h-64" width="256px" height="256px"
            [src]="mypokemon.sprites.other?.['official-artwork'].front_default" [alt]="mypokemon.name">

    @if (mypokemon.cries.latest) {
        
        <!-- <audio controls autoplay class="my-10">
            <source [src]="mypokemon.cries.latest" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio> -->
    }

    </section>


    <section class="flex flex-col justify-center items-center w-full my-10">
        <h2 class="text-2xl font-bold capitalize mt-2">Abilities</h2>
        <div class="flex flex-wrap items-center">
            @for (item of mypokemon.abilities; track item.ability) {
                <div class="bg-blue-500 bg-opacity-25 animate-fadeIn rounded-lg shadow-md flex flex-col p-4 items-center justify-center cursor-pointer m-2">
                    <h3 class="text-xl font-bold capitalize text-white">{{ item.ability?.name }}</h3>
                </div>
            }
        </div>

    </section>

}
